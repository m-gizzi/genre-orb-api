# frozen_string_literal: true

plugins:
  - rubocop-factory_bot
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/*_schema.rb"
    - "db/migrate/**/*"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "config/initializers/new_framework_defaults_*.rb"

Layout/LineLength:
  Exclude:
    - "config/initializers/devise.rb"

# Multiline calls and definitions use one argument per line, indented by 2,
# with the closing paren on its own line.
Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/FirstMethodParameterLineBreak:
  Enabled: true

Layout/MultilineMethodCallBraceLayout:
  EnforcedStyle: new_line

Layout/MultilineMethodDefinitionBraceLayout:
  EnforcedStyle: new_line

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation

# Indent a nested call's first argument one step from the start of the line,
# rather than aligning it under the outer call's paren. Without this the
# default (special_for_inner_method_call_in_parentheses) contradicts the brace
# layout above and autocorrect mangles nested calls such as expect(with_rules([...])).
Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent

# Arrays and hashes expand the same way, except that a collection whose last
# element is itself multiline may hug its brackets, e.g. errors: [{ ... }].
Layout/FirstArrayElementLineBreak:
  Enabled: true
  AllowMultilineFinalElement: true

Layout/FirstHashElementLineBreak:
  Enabled: true
  AllowMultilineFinalElement: true

Layout/MultilineArrayBraceLayout:
  EnforcedStyle: symmetrical

Layout/MultilineHashBraceLayout:
  EnforcedStyle: symmetrical

Layout/MultilineArrayLineBreaks:
  Enabled: true

Layout/MultilineHashKeyLineBreaks:
  Enabled: true

Lint/EmptyBlock:
  Exclude:
    - "config/routes.rb"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "config/routes.rb"
    - "config/environments/*.rb"

Metrics/MethodLength:
  Max: 15
  Exclude:
    - "spec/**/*"
    - "db/migrate/**/*"

Metrics/AbcSize:
  Exclude:
    - "spec/**/*"
    - "db/migrate/**/*"

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: consistent_comma

Rails/SkipsModelValidations:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 5

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/NestedGroups:
  Max: 6
